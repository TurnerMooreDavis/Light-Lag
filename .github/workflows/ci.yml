name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dev dependencies (jsdom; the game itself has none)
        run: npm ci
      - name: Run tests (unit + jsdom e2e)
        run: npm test
